name: Build and deploy site

# Builds on every pull request so a broken site is caught before merge, and
# deploys to the gh-pages branch on every push to main. This replaces running
# `mkdocs gh-deploy` by hand.
#
# GitHub Pages is served from the gh-pages branch, which is what `gh-deploy`
# writes to, so no Pages settings need changing. docs/CNAME keeps the
# cloudcon.au custom domain across deploys.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race for the gh-pages branch.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && ' (check only)' || ' and deploy' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # gh-deploy needs history to push to gh-pages.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # Runs for pull requests and pushes alike: a build failure fails the job
      # before anything is published.
      - name: Build site
        run: mkdocs build

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
