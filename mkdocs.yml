site_name: CloudCon 2026
theme:
  name: material
  custom_dir: docs/overrides
  logo: images/cloudcon_logo.png
  favicon: images/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
# plugins:
#   - social
plugins: []
site_url: https://cloudcon.au
# Mirrors the homepage menu, so the drawer on speaker and talk pages offers
# the same destinations as the banner and the homepage's own mobile menu.
nav:
  - Home: "/"
  - About: "/#about"
  - Speakers: "/#speakers"
  - Sessions: "/#sessions"
  - Schedule: "/#schedule"
  - Sponsors: "/#sponsors"
  - Venue: "/#venue"
  - CFP: "/#cfp"
  - FAQ: "/#faq"
  - Register Now: "https://regonsite.eventsair.com/cloudcon-2026/registration/Site/Register"

extra:
  social:
      - icon: fontawesome/brands/linkedin 
        link: https://www.linkedin.com/company/cloudnativesydney
extra_css:
  - overrides/assets/stylesheets/extra.css
markdown_extensions: 
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
